[wkhtmltopdf]
web-enable-local-file-access=true
load-error-handling=ignore
load-media-error-handling=ignore
javascript-delay=10000
no-stop-slow-scripts=true
enable-javascript=true
disable-smart-shrinking=true
enable-local-file-access=true
allow=/var/www/html
cache-dir=/tmp/wkhtmltopdf-cache
image-quality=100
image-dpi=300
page-size=Letter
margin-top=10
margin-bottom=10
margin-left=10
margin-right=10
encoding=UTF-8
grayscale=false
no-background=false
no-images=false
no-outline=true
disable-external-links=false
enable-internal-links=true
print-media-type=true
lowquality=false
