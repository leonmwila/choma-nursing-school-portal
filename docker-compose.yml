services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DatabaseType=postgresql
      - DatabaseServer=db
      - DatabasePort=5432
      - DatabaseName=rosariosis
      - DatabaseUsername=rosariosis
      - DatabasePassword=rosariosis_password
      - APACHE_TIMEOUT=300
      - PHP_MAX_EXECUTION_TIME=300
      - PHP_MEMORY_LIMIT=512M
      - FONTCONFIG_CACHE_DIR=/tmp/fontconfig-cache
      - HOME=/tmp
      - DISPLAY=:99
    networks:
      - app-network

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rosariosis
      - POSTGRES_USER=rosariosis
      - POSTGRES_PASSWORD=rosariosis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rosariosis.sql:/docker-entrypoint-initdb.d/rosariosis.sql
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
